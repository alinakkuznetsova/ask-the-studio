name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: dependency audit
        run: npm audit --omit=dev --audit-level=high && npm --prefix web ci && npm --prefix web audit --omit=dev --audit-level=high
      - name: build
        run: npm run build
